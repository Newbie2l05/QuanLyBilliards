services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bidacsharp-app
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: Server=mysql;Port=3306;Database=billiard_club;User ID=root;Password=root;Allow User Variables=True;
      LocalRuntimeDatabase__Enabled: "false"
    ports:
      - "7092:8080"

  mysql:
    image: mysql:8.4
    container_name: bidacsharp-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"
    command: --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 12
    volumes:
      - mysql-data:/var/lib/mysql
      - ./schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro

volumes:
  mysql-data:
