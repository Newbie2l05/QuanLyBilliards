<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Order - Billiard Club</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="/css/style.css?v=20260525-qr-3" rel="stylesheet">
</head>
<body class="qr-order-page">
    <div class="qr-order-shell">
        <div id="qrOrderHero" class="qr-order-hero">
            <div class="placeholder-glow">
                <span class="placeholder col-8"></span>
                <span class="placeholder col-5"></span>
            </div>
        </div>

        <div id="qrOrderMenu"></div>
    </div>

    <div class="qr-order-cart">
        <div class="d-flex justify-content-between align-items-center gap-3 flex-wrap">
            <div>
                <div style="font-size:12px;color:var(--text-secondary)">Giỏ hàng hiện tại</div>
                <div style="font-size:18px;font-weight:700" id="qrCartSummary">0 món • 0đ</div>
            </div>
            <div class="d-flex gap-2">
                <button type="button" class="btn btn-outline-light" id="qrCartToggleBtn" onclick="openQrCartDrawer()">
                    <i class="bi bi-bag-check me-1"></i>Xem giỏ hàng
                </button>
                <button type="button" class="btn btn-gradient-success" id="qrSubmitBtn" onclick="submitQrOrder()" disabled>
                    <i class="bi bi-send-check me-1"></i>Gửi order
                </button>
            </div>
        </div>
    </div>

    <div class="offcanvas offcanvas-bottom qr-cart-drawer" tabindex="-1" id="qrCartDrawer">
        <div class="offcanvas-header">
            <div>
                <div style="font-size:12px;color:var(--text-secondary)">Giỏ hàng của bàn</div>
                <h5 class="offcanvas-title mb-0">Xác nhận order</h5>
            </div>
            <button type="button" class="btn-close btn-close-white text-reset" data-bs-dismiss="offcanvas"></button>
        </div>
        <div class="offcanvas-body">
            <div class="qr-order-cart-items" id="qrCartItems">
                <div style="color:var(--text-muted);font-size:13px">Chưa có món trong giỏ hàng</div>
            </div>
            <div class="mt-3">
                <label class="form-label">Ghi chú cho cả đơn</label>
                <textarea class="form-control" id="qrOrderNote" rows="3" placeholder="Ví dụ: ưu tiên làm trước 2 lon nước đá"></textarea>
            </div>
            <div class="d-flex justify-content-between align-items-center gap-3 mt-4 flex-wrap">
                <div>
                    <div style="font-size:12px;color:var(--text-secondary)">Tổng tạm tính</div>
                    <div style="font-size:24px;font-weight:800" id="qrCartDrawerSummary">0 món • 0đ</div>
                </div>
                <button type="button" class="btn btn-gradient-success btn-lg" id="qrDrawerSubmitBtn" onclick="submitQrOrder()" disabled>
                    <i class="bi bi-send-check me-1"></i>Gửi order
                </button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/common.js?v=20260525-admin-1"></script>
    <script src="/js/table-order.js?v=20260525-qr-4"></script>
</body>
</html>
