<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Đăng nhập - Billiard Club</title>
    <meta name="description" content="Hệ thống quản lý quán bi-a - đăng nhập">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="/css/style.css?v=20260418-stable-1" rel="stylesheet">
</head>
<body>
    <div class="login-page">
        <div class="login-container fade-in">
            <div class="login-logo">
                <div class="icon">🎱</div>
                <h1>99 Billiard Club</h1>
                <p>Hệ thống quản lý quán bi-a</p>
            </div>

            <form id="loginForm">
                <div class="mb-3">
                    <label class="form-label">Tên đăng nhập</label>
                    <div class="input-group">
                        <span class="input-group-text" style="background:var(--bg-input);border-color:var(--border-color);color:var(--text-muted)">
                            <i class="bi bi-person"></i>
                        </span>
                        <input type="text" class="form-control" id="username" placeholder="Nhập tên đăng nhập" required autofocus>
                    </div>
                </div>
                <div class="mb-4">
                    <label class="form-label">Mật khẩu</label>
                    <div class="input-group">
                        <span class="input-group-text" style="background:var(--bg-input);border-color:var(--border-color);color:var(--text-muted)">
                            <i class="bi bi-lock"></i>
                        </span>
                        <input type="password" class="form-control" id="password" placeholder="Nhập mật khẩu" required>
                    </div>
                </div>
                <div id="loginError" class="alert alert-danger d-none" style="font-size:13px"></div>
                <button type="submit" class="btn btn-login">
                    <i class="bi bi-box-arrow-in-right me-2"></i>Đăng nhập
                </button>
            </form>

        </div>
    </div>

    <script src="/js/common.js?v=20260525-admin-1"></script>
    <script src="/js/auth.js?v=20260525-admin-1"></script>
</body>
</html>
